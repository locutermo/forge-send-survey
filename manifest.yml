modules:
  webtrigger:
    - key: survey-webtrigger
      function: survey-handler
      urlFormat: v2
      response:
        type: dynamic
  jira:projectPage:
    - key: survey-metrics-project-page
      title: Reporte de Encuestas
      resource: main
      render: native
  jira:workflowPostFunction:
    - key: send-survey-email
      name: Enviar Encuesta de Satisfacción por Correo
      description: Envía un correo con el enlace de la encuesta al reporter cuando el ticket pasa a estado Cerrado
      function: send-survey-email-fn
  trigger:
    - key: issue-closed-trigger
      events:
        - avi:jira:updated:issue
      function: send-survey-email-fn
  function:
    - key: survey-handler
      handler: index.run
    - key: send-survey-email-fn
      handler: index.sendSurveyEmail
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/c0d9da9c-4819-4d0f-bdf8-1bcb39654fb6
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
