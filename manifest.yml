modules:
  webtrigger:
    - key: survey-webtrigger
      function: survey-handler
      urlFormat: v2
      response:
        type: dynamic
  jira:projectPage:
    - key: survey-metrics-project-page
      function: project-page-fn
      title: Reporte de Encuestas
  function:
    - key: survey-handler
      handler: index.run
    - key: project-page-fn
      handler: project-page.run
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/c0d9da9c-4819-4d0f-bdf8-1bcb39654fb6
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
