modules:
  webtrigger:
    - key: survey-webtrigger
      function: survey-handler
      urlFormat: v2
      response:
        type: dynamic
  jira:projectPage:
    - key: survey-metrics-project-page
      title: Reporte de Encuestas
      resource: main
      render: native
      displayConditions:
        projectKey: "ITSM"
  trigger:
    - key: issue-closed-trigger
      events:
        - avi:jira:updated:issue
      function: send-survey-email-fn
  scheduledTrigger:
    - key: auto-close-expired-issues
      function: auto-close-expired-fn
      interval: hour
  function:
    - key: survey-handler
      handler: index.run
    - key: send-survey-email-fn
      handler: index.sendSurveyEmail
    - key: auto-close-expired-fn
      handler: index.autoCloseExpiredIssues
      timeoutSeconds: 120
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/c0d9da9c-4819-4d0f-bdf8-1bcb39654fb6
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
